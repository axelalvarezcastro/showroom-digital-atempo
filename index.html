<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitio Interactivo Preventa</title>
<meta name="description" content="Prototipo de sitio scroll-interactivo para torre en preventa. Edita config.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- La torre del hero se pide de entrada (antes que GSAP y el config): es lo primero que se ve.
     Mismo archivo que torre.imagen en config.js. -->
<link rel="preload" as="image" href="assets/atempo/torre-v3.jpg" fetchpriority="high">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090909; --bg2:#0f1b33; --ink:#f5f1e8; --muted:#b9b3a6; --gold:#C59B3F; --gold2:#e2c276;
    --panel:rgba(9,9,9,.78); --line:rgba(197,155,63,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-weight:300;overflow-x:hidden}
  img{display:block;max-width:100%}
  h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:.01em}
  .btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--gold);color:#090909;font-weight:500;padding:.8rem 1.3rem;border-radius:4px;text-decoration:none;font-size:.9rem;border:0;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}

  /* NAV */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(to bottom,rgba(9,9,9,.75),transparent)}
  .nav .brand{display:flex;align-items:center;gap:.6rem;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase}
  .nav .brand i{width:22px;height:22px;border:1px solid var(--gold);display:inline-block}
  .nav .links{display:none;gap:1.6rem;font-size:.8rem;color:var(--muted)}
  .nav .links a{color:inherit;text-decoration:none}
  @media(min-width:860px){.nav .links{display:flex}.nav{padding:18px 40px}}
  @media(max-width:600px){.nav .btn{padding:.6rem .9rem;font-size:.8rem;white-space:nowrap}.nav .brand{font-size:.72rem;letter-spacing:.12em}}

  /* HERO */
  /* La torre se encuadra por JS (fit): cover en horizontal, torre completa en vertical.
     El degradé del fondo continúa el cielo y la plaza del render cuando sobra pantalla. */
  .hero,.unit .tower{background:linear-gradient(to bottom,var(--sky,#304664),var(--sky,#304664) 30%,var(--ground,#1d1a1c) 70%)}
  .hero{position:relative;height:100vh;height:100svh;overflow:hidden}
  .hero > img,.unit .tower > img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;transform-origin:50% 50%}
  /* En vertical sobra pantalla arriba y abajo: los bordes del render se funden con el degradé. */
  @media(orientation:portrait){.hero > img,.unit .tower > img{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 6%,#000 94%,transparent)}}
  /* Velo inferior para que el titular se lea sobre renders claros. */
  .hero::before,.replica .veil{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(9,9,9,.85),transparent);pointer-events:none;z-index:1}
  /* Recuadro "Selecciona un piso e ingresa": invita a la acción y lleva directo a cada residencia. */
  .pick{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;background:rgba(9,9,9,.8);border:1px solid var(--line);border-radius:8px;padding:16px}
  .pick small{letter-spacing:.2em;text-transform:uppercase;font-size:.6rem;color:var(--gold2)}
  .pick h1{font-size:clamp(1.7rem,3.2vw,2.5rem);line-height:1.02;margin:.35rem 0 .45rem}
  .pick p{color:var(--muted);font-size:.8rem;line-height:1.45;margin-bottom:.85rem}
  .pick .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pick .opt{display:block;text-align:left;font:inherit;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid rgba(197,155,63,.3);border-radius:6px;padding:.55rem .7rem;cursor:pointer;transition:border-color .2s,background .2s}
  .pick .opt:hover{border-color:var(--gold2);background:rgba(197,155,63,.14)}
  .pick .opt b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.3rem;font-weight:500;color:var(--gold2);line-height:1.05}
  .pick .opt span{font-size:.68rem;color:var(--muted)}
  .pick .stats{display:flex;gap:20px;margin-top:.85rem;padding-top:.7rem;border-top:1px solid rgba(255,255,255,.08)}
  .pick .stats div{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .pick .stats b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.35rem;letter-spacing:0;color:var(--ink);font-weight:500}
  .pick .hint{margin-top:.7rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  @media(min-width:860px){.pick{left:40px;right:auto;bottom:36px;width:350px;padding:20px 22px}}
  @media(max-width:600px){.pick p,.pick .stats{display:none}.pick{padding:14px}}
  /* Regla de niveles (escritorio): los rangos dorados son las residencias y llevan directo a ellas. */
  .ruler{position:absolute;right:32px;top:50%;transform:translateY(-50%);height:min(62vh,560px);width:84px;z-index:2;display:none;flex-direction:column;align-items:flex-end;
    padding:14px 14px 18px;background:rgba(9,9,9,.62);border:1px solid rgba(245,241,232,.1);border-radius:6px}
  @media(min-width:860px) and (hover:hover){.ruler{display:flex}}
  .ruler small{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .ruler .rt{position:relative;flex:1;width:100%}
  .ruler i{position:absolute;right:0;height:1px;width:8px;background:rgba(245,241,232,.4)}
  .ruler i.big{width:14px;background:rgba(245,241,232,.75)}
  .ruler .n{position:absolute;right:20px;transform:translateY(-50%);font-size:.62rem;color:var(--ink);opacity:.7}
  .ruler .rng{position:absolute;right:-3px;width:7px;min-height:7px;border-radius:4px;background:var(--gold);box-shadow:0 0 12px rgba(226,194,118,.6);cursor:pointer;border:0;padding:0}
  /* Etiqueta del rango, por fuera de la regla (a la izquierda) para no pisar los números. */
  .ruler .rng span{position:absolute;right:76px;top:50%;transform:translateY(-50%);font-family:"Cormorant Garamond",serif;font-size:1rem;line-height:1;color:var(--gold2);white-space:nowrap;
    background:rgba(9,9,9,.82);border:1px solid var(--line);border-radius:3px;padding:4px 7px}
  .ruler .rng:hover span{border-color:var(--gold2)}
  .ruler .cur{position:absolute;right:0;width:22px;height:2px;background:var(--ink);transform:translateY(-50%);opacity:0;transition:opacity .15s}
  /* Piso bajo el mouse sobre la torre (escritorio). */
  .hov{position:absolute;z-index:2;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid rgba(245,241,232,.55);background:rgba(245,241,232,.1);border-radius:2px}
  .hov.on{opacity:1}
  .hov.res{border-color:var(--gold2);background:rgba(226,194,118,.22);box-shadow:0 0 18px rgba(226,194,118,.45)}
  .hov .tip{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:rgba(9,9,9,.88);border:1px solid var(--line);border-radius:4px;padding:6px 10px;white-space:nowrap;font-size:.72rem;line-height:1.3}
  .hov .tip b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.15rem;font-weight:500;color:var(--gold2)}
  .hov .tip span{color:var(--muted)}
  .hero.lvl{cursor:pointer}
  .pin.hl .card{border-color:var(--gold2);background:rgba(40,30,10,.92)}
  .pick .opt em{display:block;font-style:normal;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);margin-top:.2rem}
  /* Disponibilidad por nivel en la ficha (DEMO: estados inventados). */
  .unit .panel .avail{margin:-.2rem 0 .9rem}
  .unit .panel .avail .ah{display:flex;justify-content:space-between;align-items:baseline;font-size:.72rem;color:var(--muted);margin-bottom:.45rem}
  .unit .panel .avail .ah b{font-weight:500;color:var(--gold2);font-size:.78rem}
  .unit .panel .avail .lv{display:flex;flex-wrap:wrap;gap:5px}
  .unit .panel .avail .lv i{font-style:normal;min-width:30px;height:26px;padding:0 4px;display:grid;place-items:center;font-size:.7rem;border-radius:3px;border:1px solid}
  .s-d{border-color:var(--gold2);background:rgba(226,194,118,.18);color:var(--ink)}
  .s-a{border-color:rgba(226,194,118,.45);border-style:dashed !important;color:var(--muted)}
  .s-v{border-color:rgba(245,241,232,.12);color:rgba(245,241,232,.3);text-decoration:line-through}
  .unit .panel .avail .lg{display:flex;gap:12px;margin-top:.45rem;font-size:.62rem;color:var(--muted)}
  .unit .panel .avail .lg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;border:1px solid;margin-right:5px;vertical-align:-1px}
  .unit .panel .avail .lg .s-d,.unit .panel .avail .lg .s-a,.unit .panel .avail .lg .s-v{background:none;border:0;text-decoration:none;color:var(--muted)}
  .unit .panel .avail .lg .s-d::before{border-color:var(--gold2);background:rgba(226,194,118,.3)}
  .unit .panel .avail .lg .s-a::before{border-color:rgba(226,194,118,.6);border-style:dashed}
  .unit .panel .avail .lg .s-v::before{border-color:rgba(245,241,232,.2)}
  /* WhatsApp (DEMO: no hace nada). Flotante abajo a la derecha; en celular sube por encima del recuadro
     del hero y se oculta en la ficha, que tiene su propio botón. */
  .wa{position:fixed;right:20px;bottom:20px;z-index:60;height:56px;min-width:56px;border-radius:28px;background:#25d366;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;
    text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:bottom .35s ease,opacity .3s,transform .3s}
  .wa svg{width:26px;height:26px;flex:0 0 auto}
  .wa span{font-size:.82rem;font-weight:500;max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .35s ease}
  .wa:hover span{max-width:200px}
  /* Sobre el hero en celular: centrado en el borde superior del recuadro (esquina derecha, libre de pins). */
  body.wa-up .wa{bottom:calc(var(--pickH,200px) - 8px)}
  @media(max-width:859px){.wa{height:48px;min-width:48px;padding:0 11px;right:12px}.wa svg{width:24px;height:24px}}
  body.in-ficha .wa{opacity:0;transform:scale(.6);pointer-events:none}
  .btn.wa-mini{background:#25d366;color:#fff;padding:0;width:46px;flex:0 0 46px !important;justify-content:center}
  .btn.wa-mini svg{width:22px;height:22px}
  .btn.wa-line{background:#25d366;color:#fff}
  .btn.wa-line svg{width:20px;height:20px}
  @media(max-width:600px){.unit .panel .avail .lg{display:none}.unit .panel .spaces small{display:none}}
  .pin.hl .dot{transform:scale(1.3)}
  /* Réplica del hero sobre el escenario del zoom, solo al entrar con click: titular y pins
     siguen en pantalla y se desvanecen con el scroll (y los pins viajan con la torre). */
  .unit .replica{position:absolute;inset:0;z-index:4;pointer-events:none;visibility:hidden}
  .unit .replica.on{visibility:visible}
  .unit .replica .gp{position:absolute;left:0;top:0;z-index:3}
  .unit .replica .pin{left:0;top:0}

  /* HOTSPOTS */
  /* El ancla (left/top) es el centro del punto, no del bloque punto+tarjeta. */
  .pin{position:absolute;z-index:3;transform:translate(-7px,-50%);display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:var(--ink)}
  .pin .dot{flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px rgba(197,155,63,.25);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(197,155,63,.45)}70%{box-shadow:0 0 0 14px rgba(197,155,63,0)}100%{box-shadow:0 0 0 0 rgba(197,155,63,0)}}
  /* Sin backdrop-filter (caro de animar sobre la torre en movimiento); fondo un poco más opaco. */
  .pin .card{background:rgba(9,9,9,.86);border:1px solid var(--line);padding:8px 12px;border-radius:4px;display:flex;gap:10px;align-items:center;white-space:nowrap;transition:border-color .2s,background .2s}
  .pin:hover .card{border-color:var(--gold2);background:rgba(9,9,9,.9)}
  .pin .lvl{font-family:"Cormorant Garamond",serif;font-size:1.6rem;color:var(--gold2);line-height:1;white-space:nowrap}
  .pin .meta{font-size:.72rem;line-height:1.25}
  .pin .meta b{display:block;font-weight:500;font-size:.8rem}
  .pin .meta span{color:var(--muted)}
  .pin.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 7px),-50%)}
  /* Pin de amenidad: punto claro con ícono de play y tarjeta compacta. */
  .pin.amen .dot{width:18px;height:18px;background:var(--ink);box-shadow:none;animation:pulse2 2.4s infinite;display:grid;place-items:center}
  .pin.amen .dot::after{content:"";border-left:6px solid #090909;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
  @keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(245,241,232,.5)}70%{box-shadow:0 0 0 12px rgba(245,241,232,0)}100%{box-shadow:0 0 0 0 rgba(245,241,232,0)}}
  .pin.amen{transform:translate(-9px,-50%)}
  .pin.amen.flip{transform:translate(calc(-100% + 9px),-50%)}
  .pin.amen .card{padding:6px 10px;gap:8px;border-color:rgba(245,241,232,.25)}
  .pin.amen .lvl{font-size:1.05rem;color:var(--ink);opacity:.8}
  @media(max-width:600px){
    .pin .card{padding:6px 9px;max-width:calc(50vw - 28px);white-space:normal}.pin .lvl{font-size:1.2rem}
    /* En celular la amenidad es solo punto + nivel; el nombre aparece en el visor. */
    .pin.amen .meta{display:none}.pin.amen .card{padding:4px 7px}.pin.amen .lvl{font-size:.85rem}
  }

  /* UNIDAD: torre → planta 3D */
  .unit{position:relative;height:420vh}
  .unit .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--bg2)}
  .unit .layer{position:absolute;inset:0}
  .unit .layer video{width:100%;height:100%;object-fit:cover}
  /* El zoom es una Web Animation sobre esta capa (ver waapi/zoomTo en el script). */
  .unit .tower{transform-origin:0 0}
  /* Losa iluminada del nivel: vive dentro de la torre, así se agranda con el zoom. */
  .unit .band{position:absolute;height:2.2%;opacity:0;border:1px solid rgba(226,194,118,.9);border-radius:2px;
    background:linear-gradient(90deg,rgba(226,194,118,.12),rgba(226,194,118,.55),rgba(226,194,118,.12));
    box-shadow:0 0 24px 4px rgba(226,194,118,.55),inset 0 0 12px rgba(255,255,255,.35);mix-blend-mode:screen}
  .unit .band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:scan 1.6s linear infinite}
  @keyframes scan{from{background-position:-40% 0}to{background-position:140% 0}}
  .unit .shade{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 50% 50%,transparent 0 20%,rgba(5,8,15,.92) 75%)}
  /* Fondo propio: la maqueta (PNG/WebP recortado) flota sobre un degradé, sin la torre detrás. */
  .unit .floor{opacity:0;background:radial-gradient(ellipse 70% 60% at 42% 50%,#1a2a4a 0%,var(--bg2) 45%,#05080f 100%)}
  .unit .floor .tilt{position:absolute;inset:0;perspective:1400px}
  /* --panelH lo calcula layout(): en móvil la planta queda arriba de la ficha, sin taparse. */
  /* .plan lleva la animación de la maqueta; la imagen y sus hotspots viajan juntos. */
  .unit .floor .plan{position:absolute;inset:0;transform-origin:50% 60%}
  .unit .floor img{width:100%;height:100%;object-fit:contain;padding:72px 16px calc(var(--panelH,22vh) + 32px);filter:drop-shadow(0 28px 36px rgba(0,0,0,.6))}
  /* HOTSPOTS de la maqueta: cada punto abre ese ambiente. layout() ajusta .hots al dibujo de la imagen. */
  .unit .hots{position:absolute}
  .hot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
  /* Dorado con borde blanco: se distingue sobre la madera y el crema de la maqueta. */
  .hot i{width:20px;height:20px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5);position:relative}
  .hot i::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid #fff;animation:ring 2s ease-out infinite}
  @keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
  .hot span{position:absolute;left:50%;bottom:calc(100% - 4px);transform:translate(-50%,6px);white-space:nowrap;background:rgba(9,9,9,.9);border:1px solid var(--line);color:var(--ink);font-size:.72rem;padding:4px 10px;border-radius:4px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .hot:hover span,.hot.hl span{opacity:1;transform:translate(-50%,0)}
  .hot:hover i,.hot.hl i{background:#090909}
  /* En pantallas táctiles solo el punto (las etiquetas se pisan en la maqueta chica); la lista de la ficha nombra cada uno. */
  .unit .vid{opacity:0}
  .unit .panel{position:absolute;right:16px;bottom:16px;left:16px;background:rgba(9,9,9,.88);border:1px solid var(--line);padding:20px;border-radius:6px;opacity:0;transform:translateY(30px)}
  .unit .panel small{letter-spacing:.2em;text-transform:uppercase;font-size:.65rem;color:var(--gold2)}
  .unit .panel h2{font-size:2.1rem;line-height:1;margin:.3rem 0 .6rem}
  .unit .panel .specs{display:flex;gap:18px;margin:.4rem 0 .8rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.6rem 0}
  .unit .panel .specs div{font-size:.72rem;color:var(--muted)}
  .unit .panel .specs b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.5rem;color:var(--ink);font-weight:500}
  .unit .panel .specs b.na{font-size:1.05rem;padding:.3rem 0 .15rem}
  .unit .panel ul{list-style:none;font-size:.82rem;color:var(--muted);display:grid;gap:.25rem;margin-bottom:.9rem}
  .unit .panel ul li::before{content:"— ";color:var(--gold)}
  .unit .panel .price{font-size:1rem;margin-bottom:.9rem}
  .unit .panel .actions{display:flex;flex-wrap:wrap;gap:8px}
  .unit .panel .actions .btn{padding:.75rem .85rem;font-size:.84rem}
  /* Pantallas bajas: la ficha creció con la disponibilidad; los bullets se repiten en otras partes. */
  @media(min-width:860px) and (max-height:860px){.unit .panel ul{display:none}}
  .unit .panel .price span{color:var(--muted);font-size:.78rem;margin-left:.5rem}
  /* Lista de ambientes: mismo destino que los hotspots (y los resalta al pasar el mouse). */
  .unit .panel .spaces{display:grid;margin:-.2rem 0 .9rem;border-top:1px solid rgba(255,255,255,.08)}
  .unit .panel .spaces button{display:flex;align-items:center;gap:10px;font:inherit;font-size:.82rem;color:var(--ink);background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);padding:.55rem 0;cursor:pointer;text-align:left}
  .unit .panel .spaces button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold2);flex:0 0 auto}
  .unit .panel .spaces button::after{content:"→";margin-left:auto;color:var(--muted);transition:transform .2s,color .2s}
  .unit .panel .spaces button:hover::after{transform:translateX(4px);color:var(--gold2)}
  .unit .panel .spaces small{display:block;margin-bottom:.15rem}
  @media(max-width:600px){.unit .panel ul{display:none}.unit .panel{padding:16px}.unit .panel h2{font-size:1.8rem;margin-bottom:.3rem}
    .unit .panel .spaces button{padding:.45rem 0}.unit .panel .actions{flex-wrap:nowrap;gap:6px}.unit .panel .actions .btn{flex:1;justify-content:center;padding:.75rem .3rem;font-size:.74rem;white-space:nowrap}}
  @media(min-width:860px){
    .unit .panel{left:auto;width:380px;right:40px;top:0;bottom:0;margin:auto 0;height:fit-content;transform:translateX(40px)}
    .unit .floor img{padding:10vh 440px 10vh 40px}
  }

  /* AMENIDADES: grilla de tarjetas que abren el visor */
  .amenities{padding:96px 16px 72px;background:linear-gradient(to bottom,var(--bg),#0c1322)}
  .amenities header{max-width:1200px;margin:0 auto 28px}
  .amenities header small{letter-spacing:.2em;text-transform:uppercase;font-size:.65rem;color:var(--gold2)}
  .amenities header h2{font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.05;margin-top:.3rem}
  .amenities .grid{max-width:1200px;margin:0 auto;display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:700px){.amenities .grid{grid-template-columns:repeat(2,1fr)}}
  /* Con un número impar de amenidades, la última ocupa la fila entera en 2 columnas. */
  @media(min-width:700px) and (max-width:1099px){.amenities .item:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:16/9}}
  @media(min-width:1100px){.amenities .grid{grid-template-columns:repeat(var(--n,4),1fr)}.amenities{padding:120px 40px 96px}}
  .amenities .item{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.06);background:#111;text-align:left;color:var(--ink);font:inherit;padding:0}
  @media(max-width:699px){.amenities .item{aspect-ratio:16/10}}
  .amenities .item img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .amenities .item:hover img{transform:scale(1.06)}
  .amenities .item::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(9,9,9,.85),transparent 55%)}
  .amenities .item .txt{position:absolute;left:16px;right:16px;bottom:16px;z-index:1}
  .amenities .item small{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
  .amenities .item h3{font-size:1.6rem;line-height:1.05;margin-top:.2rem}
  .amenities .item .play{position:absolute;top:14px;right:14px;z-index:1;width:40px;height:40px;border-radius:50%;background:rgba(245,241,232,.92);display:grid;place-items:center}
  .amenities .item .play::after{content:"";border-left:10px solid #090909;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}

  /* VISOR de amenidad: se abre en círculo desde donde se hizo clic */
  .viewer{position:fixed;inset:0;z-index:80;background:#05070c;display:none}
  .viewer.open{display:block}
  .viewer .media{position:absolute;inset:0;overflow:hidden}
  .viewer .media video,.viewer .media img{width:100%;height:100%;object-fit:cover}
  /* Render fijo: movimiento de cámara lento (paneo + acercamiento) para que se sienta en video. */
  .viewer .media img.kb{animation:kb 9s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.04) translate(1.5%,1%)}to{transform:scale(1.18) translate(-2%,-1.5%)}}
  .viewer .media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,7,12,.85),transparent 45%),linear-gradient(to bottom,rgba(5,7,12,.55),transparent 25%)}
  .viewer .info{position:absolute;left:16px;right:16px;bottom:32px;z-index:2;max-width:560px}
  .viewer .info small{letter-spacing:.2em;text-transform:uppercase;font-size:.65rem;color:var(--gold2)}
  .viewer .info h3{font-size:clamp(2rem,5vw,3.4rem);line-height:1;margin:.3rem 0 .5rem}
  .viewer .info p{color:var(--muted);font-size:.9rem}
  .viewer .info .tag{display:inline-block;margin-top:.8rem;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid rgba(255,255,255,.15);padding:.3rem .6rem;border-radius:999px}
  .viewer .close{position:absolute;top:16px;right:16px;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.3rem;cursor:pointer}
  .viewer .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--gold);z-index:3;width:0}
  /* Cambio de ambiente: la imagen nueva entra por encima y se funde. */
  .viewer .media > *{position:absolute;inset:0}
  .viewer .back{display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1rem;font:inherit;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:rgba(9,9,9,.6);border:1px solid rgba(245,241,232,.35);border-radius:3px;padding:.6rem .9rem;cursor:pointer}
  .viewer .back:hover{border-color:var(--gold2);color:var(--gold2)}
  /* Botones a los demás ambientes/amenidades (abajo a la derecha; en celular, fila deslizable). */
  .viewer .tabs{position:absolute;left:16px;right:16px;bottom:18px;z-index:3;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .viewer .tabs::-webkit-scrollbar{display:none}
  .viewer .tabs button{flex:0 0 auto;font:inherit;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;padding:.65rem .9rem;border-radius:3px;border:1px solid rgba(245,241,232,.25);background:rgba(9,9,9,.72);color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .viewer .tabs button:hover{border-color:var(--gold2)}
  .viewer .tabs button.on{background:var(--ink);color:#090909;border-color:var(--ink)}
  .viewer.multi .info{bottom:76px}
  @media(min-width:860px){.viewer .info{left:40px;bottom:48px}.viewer.multi .info{bottom:48px;max-width:min(560px,42vw)}.viewer .close{top:24px;right:40px}
    .viewer .tabs{left:auto;right:40px;bottom:48px;max-width:52vw;flex-wrap:wrap;justify-content:flex-end;overflow:visible}}

  /* CTA */
  .cta{min-height:70vh;display:grid;place-items:center;text-align:center;padding:80px 16px;background:radial-gradient(60% 60% at 50% 40%,rgba(197,155,63,.12),transparent)}
  .cta h2{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin-bottom:.6rem}
  .cta p{color:var(--muted);max-width:520px;margin:0 auto 1.4rem}
  footer{padding:24px 16px 40px;font-size:.7rem;color:var(--muted);text-align:center;border-top:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>
<header class="nav">
  <div class="brand"><i></i><span id="brandName"></span></div>
  <nav class="links" id="navLinks"></nav>
  <a class="btn" id="navCta" href="#"></a>
</header>

<main id="app"></main>

<div class="viewer" id="viewer" aria-hidden="true">
  <div class="media"></div>
  <div class="info"><button class="back"><span aria-hidden="true">←</span><em></em></button><br><small></small><h3></h3><p></p><span class="tag"></span></div>
  <nav class="tabs" aria-label="Otros espacios"></nav>
  <button class="close" aria-label="Cerrar">×</button>
  <div class="bar"></div>
</div>

<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const S = window.SITE, P = S.proyecto;
  gsap.registerPlugin(ScrollTrigger);
  document.title = P.nombre + " · Preventa";
  document.getElementById("brandName").textContent = P.nombre;
  const nc = document.getElementById("navCta"); nc.textContent = P.cta.texto; nc.href = P.cta.url;
  document.getElementById("foot").textContent = P.disclaimer;
  document.getElementById("navLinks").innerHTML = (P.nav || []).map(l => `<a href="${l.href}">${l.texto}</a>`).join("");

  const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
  const app = document.getElementById("app");
  const amenidades = S.amenidades || [];

  // Posición del pin: la del config o calculada por nivel.
  const pinFor = (u) => u.pin || { x: 50, y: S.torre.pisoInferior - (u.nivel - 1) / (S.torre.niveles - 1) * (S.torre.pisoInferior - S.torre.pisoSuperior) };
  // Dato sin confirmar (null) → "Consultar".
  const spec = (v, label) => v == null ? `<div><b class="na">Consultar</b>${label}</div>` : `<div><b>${v}</b>${label}</div>`;
  const resumen = (u) => [u.recamaras != null && `${u.recamaras} rec`, u.banos != null && `${u.banos} baños`, u.m2 != null && `${u.m2} m²`].filter(Boolean).join(" · ");
  const nivelTxt = (u) => u.nivelEtiqueta ? `Niveles ${u.nivelEtiqueta}` : `Nivel ${u.nivel}`;
  // Encuadre de la torre dentro de su caja: "cover" en pantallas horizontales; en verticales
  // se achica hasta que la torre entera (torre.ancho) quepa en el 90 % del ancho, centrada.
  // El hero y el escenario del zoom usan el mismo encuadre, así el salto entre ambos no se nota.
  const fit = (box, img) => {
    const W = box.clientWidth, H = box.clientHeight, iw = img.naturalWidth || 16, ih = img.naturalHeight || 9;
    let s = Math.max(W / iw, H / ih), ox = (W - iw * s) / 2, oy = (H - ih * s) / 2;
    const a = S.torre.ancho;
    if (a && W < H) {
      s = Math.min(s, W * 0.9 / ((a[1] - a[0]) / 100 * iw));
      ox = W / 2 - (a[0] + a[1]) / 200 * iw * s; oy = (H - ih * s) * 0.35;
    }
    return { s, ox, oy, w: iw * s, h: ih * s };
  };
  const place = (box, img) => { const f = fit(box, img); Object.assign(img.style, { left: f.ox + "px", top: f.oy + "px", width: f.w + "px", height: f.h + "px" }); };
  // Punto (x%, y%) de la imagen → px dentro de su caja, con el mismo encuadre.
  const coverPx = (box, img, p) => {
    const f = fit(box, img);
    return { x: f.ox + p.x / 100 * f.w, y: f.oy + p.y / 100 * f.h, s: f.w / 100 };
  };
  if (S.torre.cielo) document.documentElement.style.setProperty("--sky", S.torre.cielo);
  if (S.torre.suelo) document.documentElement.style.setProperty("--ground", S.torre.suelo);
  const pins = [], stages = [], units = {};
  // Zoom por tamaño real (no por transform): con escala s = 1→k el nivel q viaja al centro C.
  // Escalar una capa con transform hace que Chrome reutilice la textura rasterizada al tamaño
  // inicial y la estire (se ve pixelado); cambiando left/top/width/height la redibuja nítida.
  // Animaciones nativas (Web Animations) en pausa, que la línea de tiempo de GSAP "scrubea"
  // moviendo currentTime. Chrome conoce de antemano la escala máxima de los keyframes y rasteriza
  // la capa a esa resolución una sola vez: el zoom queda nítido y corre entero en la placa de video.
  // (Con transforms puestos por JS cuadro a cuadro, Chrome estira la textura inicial o la redibuja.)
  const waapi = (el, frames, easing = "linear") => { const a = el.animate(frames, { duration: 1000, fill: "both", easing }); a.pause(); return a; };
  const seek = (a, p) => { if (a) a.currentTime = p * 1000; };
  // Los pins de la réplica del hero acompañan a la torre: un punto q del encuadre 1× queda en
  // q + z·(d + (k−1)·q), lo mismo que hace la animación de la capa (se mueven, no se escalan).
  const zoomTo = (sg) => {
    seek(sg.anim, sg.z);
    if (sg.ghostOn) sg.gpins.forEach(g => { g.w.style.transform =
      `translate(${g.q.x + sg.z * (sg.dx + (sg.k - 1) * g.q.x)}px, ${g.q.y + sg.z * (sg.dy + (sg.k - 1) * g.q.y)}px)`; });
  };

  /* ── HERO ─────────────────────────────────────── */
  // Recuadro y regla se arman con funciones: la réplica del zoom usa el mismo marcado.
  const T = S.torre, alto = (T.pisoInferior - T.pisoSuperior) / (T.niveles - 1);   // % de imagen por nivel
  const nivelY = n => T.pisoInferior - (n - 1) * alto;
  // DEMO: disponibilidad inventada (config.demo). Pseudoazar con semilla: la misma en cada recarga.
  const D = S.demo || {}, porNivel = D.deptosPorNivel || 6;
  const rnd = (a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(D.semillaDisponibilidad || 1);
  const ESTADO = { d: "Disponible", a: "Apartado", v: "Vendido" };
  const libres = Array.from({ length: T.niveles + 1 }, () => 1 + Math.floor(rnd() * (porNivel - 1)));   // deptos libres por nivel
  S.unidades.forEach(u => {
    if (!u.niveles) return;
    u.estados = {};
    for (let n = u.niveles[0]; n <= u.niveles[1]; n++) { const r = rnd(); u.estados[n] = r < 0.42 ? "v" : r < 0.62 ? "a" : "d"; }
    const ns = Object.keys(u.estados);
    if (!ns.some(n => u.estados[n] === "d")) u.estados[ns[ns.length - 1]] = "d";      // siempre queda al menos una
    u.total = ns.length; u.quedan = ns.filter(n => u.estados[n] === "d").length;
  });
  const quedanTxt = u => u.total ? `Quedan ${u.quedan} de ${u.total}` : "";
  const WA = `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.8 2 6.8L3.5 29l6.6-1.7c1.8 1 3.9 1.5 5.9 1.5 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.5c-1.9 0-3.8-.5-5.4-1.5l-.4-.2-3.9 1 1-3.8-.3-.4a10.4 10.4 0 0 1-1.7-5.6C5.3 10 10.1 5.3 16 5.3S26.7 10 26.7 15.8 21.9 26.5 16 26.5z"/><path fill="currentColor" d="M21.9 18.6c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1c-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2s0-.5.1-.6l.5-.6c.2-.2.2-.4.3-.6s0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.1-1.2 2.7 1.2 3.2 1.4 3.4 2.4 3.6 5.7 5c.8.3 1.4.5 1.9.7.8.2 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5s-.3-.2-.6-.4z"/></svg>`;
  const pickHTML = () => `<div class="pick">
      <small>${P.ubicacion.split(",")[0]} · ${T.niveles} niveles</small>
      <h1>Selecciona un piso<br>e ingresa.</h1>
      <p>Elige una residencia y vuela hasta su nivel: planta, precio y cada ambiente por dentro.</p>
      <div class="opts">${S.unidades.map(u => `<button class="opt" data-fly="${u.id}"><b>Niveles ${u.nivelEtiqueta}</b>
        <span>${u.recamaras} rec · ${u.m2} m²</span><em>${quedanTxt(u)}</em></button>`).join("")}</div>
      <div class="stats"><div><b>${T.niveles}</b>niveles</div><div><b>${S.unidades.length}</b>tipologías</div><div><b>+15</b>amenidades</div></div>
      <div class="hint">O toca un punto de la torre · scroll ↓</div>
    </div>`;
  const rulerHTML = () => `<div class="ruler"><small>Nivel</small><div class="rt">
      ${Array.from({ length: T.niveles }, (_, i) => { const n = i + 1, y = (T.niveles - n) / (T.niveles - 1) * 100;
        return `<i class="${n % 5 === 0 || n === 1 ? "big" : ""}" style="top:${y}%"></i>${n % 10 === 0 || n === 1 || n === T.niveles ? `<span class="n" style="top:${y}%">${n}</span>` : ""}`; }).join("")}
      ${S.unidades.filter(u => u.niveles).map(u => { const [a, b] = u.niveles, top = (T.niveles - b) / (T.niveles - 1) * 100, h = (b - a) / (T.niveles - 1) * 100;
        return `<button class="rng" data-fly="${u.id}" style="top:calc(${top}% - 3px);height:calc(${h}% + 7px)" aria-label="${u.nombre}"><span>${u.nivelEtiqueta}${u.total ? ` · ${u.quedan} disp.` : ""}</span></button>`; }).join("")}
      <b class="cur"></b></div></div>`;
  const hero = el(`<section class="hero" id="hero">
    <img src="${T.imagen}" alt="${P.nombre}" fetchpriority="high">
    <div class="hov"><div class="tip"><b></b><span></span></div></div>
    ${pickHTML()}${rulerHTML()}
  </section>`);
  S.unidades.forEach(u => {
    const p = pinFor(u);
    const a = el(`<a class="pin" href="#${u.id}" data-unit="${u.id}">
      <span class="dot"></span>
      <span class="card"><span class="lvl">${u.nivelEtiqueta || u.nivel}</span>
        <span class="meta"><b>${u.nombre}</b><span>${resumen(u)}</span></span></span>
    </a>`);
    hero.appendChild(a);
    pins.push({ a, p, lado: u.lado || "der" });
  });
  amenidades.forEach((m, k) => {
    const a = el(`<a class="pin amen" href="#amenidades" data-amen="${k}">
      <span class="dot"></span>
      <span class="card"><span class="lvl">${m.nivelCorto}</span>
        <span class="meta"><b>${m.nombre}</b><span>${m.video ? "Ver video" : "Ver render"}</span></span></span>
    </a>`);
    hero.appendChild(a);
    pins.push({ a, p: m.pin, lado: m.lado || "izq" });
  });
  app.appendChild(hero);

  /* ── UNIDADES ─────────────────────────────────── */
  S.unidades.forEach((u, i) => {
    const p = pinFor(u);
    const unit = el(`<section class="unit" id="${u.id}">
      <div class="stage">
        <div class="layer tower"><img src="${S.torre.imagenZoom || S.torre.imagen}" alt="" fetchpriority="low"><div class="band"></div></div>
        <div class="shade"></div>
        ${u.transicionVideo ? `<div class="layer vid"><video src="${u.transicionVideo}" muted playsinline preload="auto"></video></div>` : ""}
        <div class="layer floor"><div class="tilt"><div class="plan"><img src="${u.planta}" alt="Planta ${u.nombre}" fetchpriority="low">
          <div class="hots">${u.espacios.map((e, k) => e.punto ? `<button class="hot" data-room="${k}" style="left:${e.punto.x}%;top:${e.punto.y}%"><i></i><span>${e.nombre}</span></button>` : "").join("")}</div>
        </div></div></div>
        <aside class="panel">
          <small>${nivelTxt(u)} · ${P.nombre}</small>
          <h2>${u.nombre}</h2>
          <div class="specs">${spec(u.recamaras, "recámaras")}${spec(u.banos, "baños")}${spec(u.m2, "m²")}</div>
          ${u.estados ? `<div class="avail"><div class="ah"><span>Disponibilidad por nivel</span><b>${quedanTxt(u)}</b></div>
            <div class="lv">${Object.keys(u.estados).map(n => `<i class="s-${u.estados[n]}" title="Nivel ${n} · ${ESTADO[u.estados[n]]}">${n}</i>`).join("")}</div>
            <div class="lg"><span class="s-d">Disponible</span><span class="s-a">Apartado</span><span class="s-v">Vendido</span></div></div>` : ""}
          <ul>${u.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          <div class="spaces"><small>Entra a cada ambiente</small>${u.espacios.map((e, k) => `<button data-room="${k}">${e.nombre}</button>`).join("")}</div>
          <div class="price">${u.precio}<span>Entrega ${u.entrega}</span></div>
          <div class="actions"><a class="btn" href="${P.cta.url}">${P.cta.texto}</a>
          <a class="btn wa-mini" href="#" data-wa data-msg="Hola, me interesa la ${u.nombre} (${nivelTxt(u).toLowerCase()}) de ${P.nombre}." aria-label="Escribir por WhatsApp" title="WhatsApp">${WA}</a>
          <button class="btn ghost" data-back>Volver a la torre</button></div>
        </aside>
      </div>
    </section>`);
    app.appendChild(unit);

    // Línea de tiempo scrubbed por scroll:
    // 1) la cámara viaja hasta el nivel y lo centra, 2) la losa se ilumina,
    // 3) la maqueta "sale" de esa losa girando de plana a isométrica, 4) entra la ficha.
    const tower = unit.querySelector(".tower"), band = unit.querySelector(".band"), shade = unit.querySelector(".shade"),
          floor = unit.querySelector(".floor"), plan = floor.querySelector(".plan"), hots = floor.querySelector(".hots"), panel = unit.querySelector(".panel"),
          vidL = unit.querySelector(".vid"), vid = vidL && vidL.querySelector("video");
    // Réplica del hero (recuadro, regla y pins) para la entrada por click; layout() la posiciona.
    const ghost = el(`<div class="replica" aria-hidden="true"><div class="veil"></div>${pickHTML()}${rulerHTML()}</div>`);
    const gpins = pins.map(pn => {
      const w = el(`<div class="gp"></div>`), c = pn.a.cloneNode(true);
      c.removeAttribute("href"); w.appendChild(c); ghost.appendChild(w);
      return { w, c, pn, q: { x: 0, y: 0 }, active: pn.a.dataset.unit === u.id };
    });
    unit.querySelector(".stage").appendChild(ghost);
    const sg = { stage: unit.querySelector(".stage"), tower, img: tower.querySelector("img"), band, panel, plan, hots, p, ancho: u.ancho || S.torre.ancho, dx: 0, dy: 0, k: 3, z: 0, ghost, gpins, ghostOn: false, hold: false };
    stages.push(sg);
    const setGhost = (on) => { if (sg.ghostOn === on) return; sg.ghostOn = on; ghost.classList.toggle("on", on); zoomTo(sg); };
    // La réplica se apaga sola al volver al hero o cuando ya se desvaneció (salvo en "Volver a la torre",
    // que la necesita encendida mientras retrocede).
    const tl = gsap.timeline({ scrollTrigger: { trigger: unit, start: "top top", end: "bottom bottom", scrub: 0.6, invalidateOnRefresh: true,
      onLeaveBack: () => setGhost(false), onUpdate: s => { if (s.progress > 0.4 && !sg.hold) setGhost(false); } } });
    // Titular, velo y pins se desvanecen de a poco con el scroll; el pin elegido se queda
    // un poco más, hasta que se enciende la losa de su nivel.
    tl.fromTo(ghost.querySelectorAll(".pick,.ruler"), { opacity: 1, y: 0 }, { opacity: 0, y: -28, duration: 0.16, ease: "power1.in" }, 0)
      .fromTo(ghost.querySelector(".veil"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 0)
      .fromTo(gpins.filter(g => !g.active).map(g => g.w), { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in" }, 0.01)
      .fromTo(gpins.filter(g => g.active).map(g => g.w), { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "power1.in" }, 0.19);
    // Se anima un progreso z (0→1) y zoomTo() calcula el encuadre con los valores vigentes de layout(),
    // así un cambio de tamaño de pantalla no deja escalas viejas grabadas en la línea de tiempo.
    tl.fromTo(sg, { z: 0 }, { z: 1, duration: 0.42, ease: "power2.inOut", onUpdate: () => zoomTo(sg) }, 0)
      .to(shade, { opacity: 0.75, duration: 0.25 }, 0.12)
      .fromTo(band, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.12, ease: "power2.out" }, 0.22)
      .to(band, { scaleY: 1.8, duration: 0.08, ease: "power1.inOut" }, 0.3);
    if (vid) {
      // Modo video: el clip torre→planta (Higgsfield) se "scrubea" con el scroll.
      tl.to(vidL, { opacity: 1, duration: 0.08 }, 0.3)
        .to({}, { duration: 0.3, onUpdate() { if (vid.duration) vid.currentTime = vid.duration * (this.progress()); } }, 0.32)
        .to(tower, { opacity: 0, duration: 0.1 }, 0.36)
        .fromTo(floor, { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.6)
        .to(vidL, { opacity: 0, duration: 0.1 }, 0.66);
    } else {
      // Modo maqueta: la planta despega de la losa, plana y pequeña, y se para en isométrico.
      // Empieza antes de que termine el zoom: el cuadro más cercano de la torre (el de menos
      // resolución) nunca queda quieto en pantalla, siempre está fundiéndose con la maqueta.
      // También nativa: la maqueta (con drop-shadow) se rasteriza una vez a escala 1.
      const planAnim = waapi(plan, [{ transform: "translateY(60px) rotateX(72deg) scale(0.16)", opacity: 0 },
                                    { transform: "translateY(0px) rotateX(0deg) scale(1)", opacity: 1 }], "cubic-bezier(.22,1,.36,1)");
      const pp = { v: 0 };
      sg.sync = () => seek(planAnim, pp.v);
      tl.to(floor, { opacity: 1, duration: 0.12 }, 0.34)
        .fromTo(pp, { v: 0 }, { v: 1, duration: 0.3, ease: "none", onUpdate: () => seek(planAnim, pp.v) }, 0.34)
        .to(tower, { opacity: 0, duration: 0.12 }, 0.36)
        .to(band, { opacity: 0, duration: 0.08 }, 0.38);
    }
    tl.to(panel, { opacity: 1, x: 0, y: 0, duration: 0.14, ease: "power2.out" }, 0.72)
      // fromTo (no from): con invalidateOnRefresh, un from() se re-graba con opacidad 0 como destino.
      .fromTo(panel.querySelectorAll(":scope > small,h2,.specs,.avail,li,.spaces,.price,.actions"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.08, stagger: 0.008, ease: "power2.out" }, 0.76)
      // Los hotspots aparecen cuando la maqueta ya está quieta (autoAlpha: invisibles no se pueden tocar).
      .fromTo(hots.children, { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.06, stagger: 0.02, ease: "back.out(2)" }, 0.74);
    units[u.id] = { st: tl.scrollTrigger, setGhost, hold: on => { sg.hold = on; } };

    // Inclinación sutil de la maqueta con el mouse (en un contenedor aparte, no pisa al scroll).
    const tilt = floor.querySelector(".tilt");
    if (matchMedia("(hover:hover)").matches) {
      const rx = gsap.quickTo(tilt, "rotationX", { duration: 0.8, ease: "power3" }), ry = gsap.quickTo(tilt, "rotationY", { duration: 0.8, ease: "power3" });
      gsap.set(tilt, { transformPerspective: 1400 });
      unit.addEventListener("pointermove", e => { const r = unit.querySelector(".stage").getBoundingClientRect();
        ry(((e.clientX - r.left) / r.width - 0.5) * 8); rx(-((e.clientY - r.top) / r.height - 0.5) * 6); });
      unit.addEventListener("pointerleave", () => { rx(0); ry(0); });
    }

    /* ── AMBIENTES: hotspots y lista de la ficha abren el visor ── */
    const items = u.espacios.map(e => ({ small: `${nivelTxt(u)} · ${u.nombre}`, nombre: e.nombre, texto: e.texto || "",
      imagen: e.imagen, tag: "Render ilustrativo · IA" }));
    const hotOf = k => hots.querySelector(`.hot[data-room="${k}"]`);
    unit.querySelectorAll("[data-room]").forEach(b => {
      const k = +b.dataset.room;
      b.addEventListener("click", () => { const r = ((hotOf(k) || b).querySelector("i") || b).getBoundingClientRect();
        openViewer(items, k, r.left + r.width / 2, r.top + r.height / 2, "Volver a la planta"); });
      // Pasar el mouse por la lista resalta el punto en la maqueta.
      if (b.parentElement.classList.contains("spaces")) {
        b.addEventListener("mouseenter", () => hotOf(k) && hotOf(k).classList.add("hl"));
        b.addEventListener("mouseleave", () => hotOf(k) && hotOf(k).classList.remove("hl"));
      }
    });
    unit.querySelector("[data-back]").addEventListener("click", () => backToTower(u.id));
  });

  /* ── AMENIDADES ───────────────────────────────── */
  if (amenidades.length) {
    app.appendChild(el(`<section class="amenities" id="amenidades">
      <header><small>${P.amenidadesTitulo || "Amenidades"}</small><h2>${P.amenidadesTexto || "Espacios para tu estilo de vida."}</h2></header>
      <div class="grid" style="--n:${Math.min(amenidades.length, 5)}">${amenidades.map((m, k) => `<button class="item" data-amen="${k}">
        <img src="${m.poster || m.imagen}" alt="${m.nombre}" loading="lazy">${m.video ? '<span class="play"></span>' : ""}
        <span class="txt"><small>${m.nivel}</small><h3>${m.nombre}</h3></span></button>`).join("")}</div>
    </section>`));
  }

  /* ── CTA ──────────────────────────────────────── */
  app.appendChild(el(`<section class="cta" id="agenda">
    <div><h2>${P.cierre.titulo}</h2>
    <p>${P.cierre.texto}</p>
    <a class="btn" href="${P.cta.url}">${P.cta.texto}</a>
    <a class="btn wa-line" href="#" data-wa data-msg="Hola, quiero agendar una visita a ${P.nombre}.">${WA} WhatsApp</a></div>
  </section>`));

  /* ── VISOR (ambientes y amenidades) ───────────── */
  // Se abre en círculo desde el punto tocado. Abajo a la derecha, botones a los demás espacios
  // del mismo grupo; ←/→ y deslizar también cambian, Esc o "Volver" cierran.
  const viewer = document.getElementById("viewer"), vMedia = viewer.querySelector(".media"), vBar = viewer.querySelector(".bar"),
        vTabs = viewer.querySelector(".tabs");
  let vOrigin = { x: innerWidth / 2, y: innerHeight / 2 }, vItems = [], vIdx = 0;
  const amenItems = amenidades.map(m => ({ small: m.nivel, nombre: m.nombre, texto: m.descripcion || "", imagen: m.imagen, video: m.video, poster: m.poster,
    tag: m.video ? "Render en movimiento · IA" : m.ia ? "Render ilustrativo · IA" : "Render del desarrollador" }));
  function showItem(k, first) {
    vIdx = (k + vItems.length) % vItems.length; const m = vItems[vIdx];
    const node = el(m.video ? `<video src="${m.video}" poster="${m.poster || ""}" muted playsinline autoplay loop preload="auto"></video>`
                            : `<img class="kb" src="${m.imagen}" alt="${m.nombre}">`);
    const old = [...vMedia.children];
    vMedia.appendChild(node);
    if (first) old.forEach(o => o.remove());
    else gsap.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out", onComplete: () => old.forEach(o => o.remove()) });
    viewer.querySelector("small").textContent = m.small;
    viewer.querySelector("h3").textContent = m.nombre;
    viewer.querySelector("p").textContent = m.texto;
    viewer.querySelector(".tag").textContent = m.tag;
    vTabs.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === vIdx));
    const on = vTabs.querySelector(".on");                // en celular la fila se desliza hasta el activo
    if (on && vTabs.scrollWidth > vTabs.clientWidth) vTabs.scrollTo({ left: on.offsetLeft - 16, behavior: first ? "auto" : "smooth" });
    gsap.killTweensOf(vBar); vBar.style.width = 0;
    if (node.tagName === "VIDEO") { node.play().catch(() => {}); node.ontimeupdate = () => { if (node.duration) vBar.style.width = (node.currentTime / node.duration * 100) + "%"; }; }
    if (!first) gsap.fromTo(viewer.querySelectorAll(".info small,.info h3,.info p"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.05, ease: "power2.out" });
  }
  function openViewer(items, k, x, y, backLabel) {
    vItems = items; vOrigin = { x, y };
    vTabs.innerHTML = items.length > 1 ? items.map((m, i) => `<button data-i="${i}">${m.nombre}</button>`).join("") : "";
    viewer.classList.toggle("multi", items.length > 1);
    viewer.querySelector(".back em").textContent = backLabel;
    showItem(k, true);
    viewer.classList.add("open"); viewer.setAttribute("aria-hidden", "false");
    document.documentElement.style.overflow = "hidden";
    gsap.fromTo(viewer, { clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(150% at ${x}px ${y}px)`, duration: 0.9, ease: "power3.inOut" });
    gsap.fromTo(viewer.querySelectorAll(".info > :not(br), .tabs"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.06, delay: 0.45, ease: "power2.out" });
  }
  function closeViewer() {
    if (!viewer.classList.contains("open")) return;
    gsap.to(viewer, { clipPath: `circle(0px at ${vOrigin.x}px ${vOrigin.y}px)`, duration: 0.6, ease: "power3.inOut", onComplete() {
      viewer.classList.remove("open"); viewer.setAttribute("aria-hidden", "true"); vMedia.innerHTML = ""; gsap.killTweensOf(vBar); vBar.style.width = 0;
      document.documentElement.style.overflow = "";
    } });
  }
  vTabs.addEventListener("click", e => { const b = e.target.closest("button"); if (b && +b.dataset.i !== vIdx) showItem(+b.dataset.i); });
  viewer.querySelector(".close").addEventListener("click", closeViewer);
  viewer.querySelector(".back").addEventListener("click", closeViewer);
  addEventListener("keydown", e => {
    if (!viewer.classList.contains("open")) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight" && vItems.length > 1) showItem(vIdx + 1);
    else if (e.key === "ArrowLeft" && vItems.length > 1) showItem(vIdx - 1);
  });
  let tx = null;
  viewer.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
  viewer.addEventListener("touchend", e => { if (tx == null || vItems.length < 2) return; const d = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(d) > 50 && !e.target.closest(".tabs")) showItem(vIdx + (d < 0 ? 1 : -1)); });
  document.querySelectorAll("[data-amen]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); const r = (b.querySelector(".dot") || b).getBoundingClientRect();
    openViewer(amenItems, +b.dataset.amen, r.left + r.width / 2, r.top + r.height / 2, "Volver");
  }));

  /* ── CLIC EN UNIDAD: zoom cinematográfico ─────── */
  // Se salta al inicio de la sección con la réplica del hero encendida (torre, recuadro y pins
  // idénticos, así que el salto no se nota) y se reproduce la línea de tiempo como un clip:
  // el zoom arranca en el acto y los textos se van desvaneciendo mientras avanza.
  let playing = null;
  const cancelPlay = () => { if (playing) { playing.kill(); playing = null; } };
  ["wheel", "touchstart", "keydown"].forEach(ev => addEventListener(ev, cancelPlay, { passive: true }));
  // Arranca con velocidad (responde al click) y frena suave al final; el scrub de 0.6 s redondea el arranque.
  const glide = t => 0.4 * t + 0.6 * (1 - Math.cos(Math.PI * t)) / 2;
  const hov = hero.querySelector(".hov"), cur = hero.querySelector(".ruler .cur");
  let hovUnit = null;
  const hovOff = () => { hov.classList.remove("on"); cur.style.opacity = 0; hovUnit = null; hero.classList.remove("lvl"); };
  const flyTo = uid => {
    cancelPlay(); hovOff();
    const U = units[uid], st = U.st, y = { v: st.start };
    U.setGhost(true);
    window.scrollTo(0, st.start); ScrollTrigger.update();
    // 2 cuadros de margen para que la capa de la torre ya esté en la GPU cuando empieza el movimiento.
    playing = gsap.timeline({ delay: 0.04, onComplete() { playing = null; } })
      .to(y, { v: st.start + (st.end - st.start) * 0.97, duration: 7, ease: glide, onUpdate() { window.scrollTo(0, y.v); } });
  };
  // "Volver a la torre": el mismo clip al revés (la réplica reaparece mientras la cámara se aleja)
  // y, ya en el encuadre del hero, el salto al inicio de la página, que es idéntico.
  const backToTower = uid => {
    cancelPlay();
    const U = units[uid], st = U.st, y = { v: window.scrollY };
    U.hold(true); U.setGhost(true);
    playing = gsap.timeline({ onComplete() { playing = null; window.scrollTo(0, 0); ScrollTrigger.update(); U.hold(false); U.setGhost(false); } })
      .to(y, { v: st.start, duration: 3, ease: "power2.inOut", onUpdate() { window.scrollTo(0, y.v); } })
      .to({}, { duration: 0.7 });                     // el scrub (0.6 s) termina de alcanzar el inicio
  };
  hero.querySelectorAll(".pin[data-unit], [data-fly]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); flyTo(a.dataset.unit || a.dataset.fly);
  }));
  // Los botones del recuadro y la regla resaltan el pin de su residencia.
  hero.querySelectorAll("[data-fly]").forEach(b => {
    const pin = hero.querySelector(`.pin[data-unit="${b.dataset.fly}"]`);
    b.addEventListener("mouseenter", () => pin.classList.add("hl"));
    b.addEventListener("mouseleave", () => pin.classList.remove("hl"));
  });

  /* ── PISO BAJO EL MOUSE (escritorio) ──────────── */
  // Sobre la torre se resalta el nivel y la regla lo marca; en un nivel de residencia, click = entrar.
  if (matchMedia("(hover:hover) and (min-width:860px)").matches) {
    hero.addEventListener("mousemove", e => {
      if (e.target.closest(".pin,.pick,.ruler")) return hovOff();
      const f = fit(hero, heroImg), r = hero.getBoundingClientRect();
      const px = (e.clientX - r.left - f.ox) / f.w * 100, py = (e.clientY - r.top - f.oy) / f.h * 100;
      const n = Math.round((T.pisoInferior - py) / alto) + 1;
      if (!T.ancho || px < T.ancho[0] || px > T.ancho[1] || n < 1 || n > T.niveles) return hovOff();
      hovUnit = S.unidades.find(u => u.niveles && n >= u.niveles[0] && n <= u.niveles[1]) || null;
      hov.classList.add("on"); hov.classList.toggle("res", !!hovUnit); hero.classList.toggle("lvl", !!hovUnit);
      const a = coverPx(hero, heroImg, { x: T.ancho[0], y: nivelY(n) + alto / 2 }), b = coverPx(hero, heroImg, { x: T.ancho[1], y: nivelY(n) - alto / 2 });
      Object.assign(hov.style, { left: a.x + "px", top: b.y + "px", width: b.x - a.x + "px", height: a.y - b.y + "px" });
      hov.querySelector("b").textContent = `Nivel ${n}`;
      hov.querySelector("span").textContent = hovUnit ? `${hovUnit.nombre} · ${ESTADO[hovUnit.estados[n]]} · click para entrar`
                                                      : `${libres[n]} de ${porNivel} disponibles · elige un nivel dorado`;
      cur.style.opacity = 1; cur.style.top = (T.niveles - n) / (T.niveles - 1) * 100 + "%";
    });
    hero.addEventListener("mouseleave", hovOff);
    hero.addEventListener("click", e => { if (hovUnit && !e.target.closest(".pin,.pick,.ruler")) flyTo(hovUnit.id); });
  }

  // Recalcula todo lo que depende del tamaño real de la imagen y del viewport.
  const heroImg = hero.querySelector("img"), pickBox = hero.querySelector(".pick");
  function layout() {
    place(hero, heroImg);
    document.body.style.setProperty("--pickH", pickBox.offsetHeight + "px");
    pins.forEach(({ a, p, lado }) => {
      const q = coverPx(hero, heroImg, p);
      a.style.left = q.x + "px"; a.style.top = q.y + "px";
      a.classList.toggle("flip", lado === "izq");
      const r = a.getBoundingClientRect();
      if (r.right > window.innerWidth - 8) a.classList.add("flip");
      else if (r.left < 8) a.classList.remove("flip");
      // Si la tarjeta cae sobre el recuadro "Selecciona un piso", va del otro lado del punto.
      const c = a.querySelector(".card").getBoundingClientRect(), k = pickBox.getBoundingClientRect();
      if (c.left < k.right && c.right > k.left && c.top < k.bottom && c.bottom > k.top) a.classList.toggle("flip");
    });
    const mobile = window.innerWidth < 860;
    stages.forEach(sg => {
      const { stage, tower, img, band, panel, p, ancho } = sg;
      const W = stage.clientWidth, H = stage.clientHeight;
      // Zoom que la imagen aguanta nítida (torre-v3-zoom.jpg: 5504 px nativos, sin upscale).
      // Más allá se ve borroso por falta de píxeles, no por el código.
      sg.k = mobile ? 2.3 : 2.4;
      const k = sg.k, f = fit(stage, img), q = coverPx(stage, img, p);
      // La losa ocupa el ancho de la torre en ese nivel (config), o 12 % si no está definido.
      const x1 = ancho ? coverPx(stage, img, { x: ancho[0], y: p.y }).x : q.x - q.s * 6, x2 = ancho ? coverPx(stage, img, { x: ancho[1], y: p.y }).x : q.x + q.s * 6;
      // La capa de la torre mide k× el escenario (todo adentro en coordenadas k×) y la animación
      // va de escala 1/k (idéntica al hero) a escala 1 con el nivel q en el centro C de la pantalla.
      Object.assign(tower.style, { width: W * k + "px", height: H * k + "px", right: "auto", bottom: "auto" });
      Object.assign(img.style, { left: f.ox * k + "px", top: f.oy * k + "px", width: f.w * k + "px", height: f.h * k + "px" });
      Object.assign(band.style, { left: x1 * k + "px", top: (q.y - H * 0.011) * k + "px", width: (x2 - x1) * k + "px", height: H * 0.022 * k + "px" });
      const dx = W / 2 - k * q.x, dy = H * 0.45 - k * q.y;
      sg.dx = dx; sg.dy = dy;
      sg.gpins.forEach(g => { g.q = coverPx(stage, img, g.pn.p); g.c.className = g.pn.a.className; });
      if (sg.anim) sg.anim.cancel();
      sg.anim = waapi(tower, [{ transform: `translate(0px, 0px) scale(${1 / k})` }, { transform: `translate(${dx}px, ${dy}px) scale(1)` }]);
      zoomTo(sg);
      stage.style.setProperty("--panelH", panel.offsetHeight + "px");
      // .hots cubre justo el dibujo de la maqueta (object-fit: contain dentro del padding).
      const pi = sg.plan.querySelector("img"), cs = getComputedStyle(pi), pad = k => parseFloat(cs["padding" + k]);
      const cw = pi.clientWidth - pad("Left") - pad("Right"), ch = pi.clientHeight - pad("Top") - pad("Bottom");
      const nw = pi.naturalWidth || 16, nh = pi.naturalHeight || 9, s = Math.min(cw / nw, ch / nh);
      Object.assign(sg.hots.style, { left: pad("Left") + (cw - nw * s) / 2 + "px", top: pad("Top") + (ch - nh * s) / 2 + "px", width: nw * s + "px", height: nh * s + "px" });
    });
  }
  layout();
  heroImg.addEventListener("load", () => { layout(); ScrollTrigger.refresh(); });
  stages.forEach(sg => { sg.img.addEventListener("load", layout); sg.plan.querySelector("img").addEventListener("load", layout); });
  // Decodificar por adelantado la torre 4K y las maquetas: si no, el navegador las decodifica
  // recién al mostrarlas (en el salto del click) y ese cuadro se traba.
  window.addEventListener("load", () => document.querySelectorAll(".unit img").forEach(i => i.decode && i.decode().catch(() => {})));
  window.addEventListener("resize", layout);
  window.addEventListener("load", () => { layout(); ScrollTrigger.refresh(); });
  ScrollTrigger.addEventListener("refreshInit", layout);
  // Al cargar con el scroll ya restaurado (recarga a mitad de página), ScrollTrigger salta a esa
  // posición sin disparar los onUpdate: el zoom y la maqueta se sincronizan a mano con sus valores.
  ScrollTrigger.addEventListener("refresh", () => stages.forEach(sg => { zoomTo(sg); sg.sync && sg.sync(); }));

  /* ── WHATSAPP (DEMO: no hace nada) ────────────── */
  // data-msg guarda el mensaje que se mandaría; cuando haya número, el click abre wa.me con ese texto.
  document.body.appendChild(el(`<a class="wa" href="#" data-wa data-msg="Hola, me interesa ${P.nombre}." aria-label="Escribir por WhatsApp">${WA}<span>Escríbenos</span></a>`));
  document.addEventListener("click", e => { if (e.target.closest("[data-wa]")) e.preventDefault(); });
  const waPlace = () => {
    // En celular, sobre el hero, sube por encima del recuadro; en la ficha se oculta (tiene el suyo).
    document.body.classList.toggle("wa-up", innerWidth < 860 && scrollY < hero.offsetHeight * 0.6);
    // Desde scrollY (no desde st.progress, que ScrollTrigger actualiza un cuadro después).
    const y = window.scrollY;
    document.body.classList.toggle("in-ficha", Object.values(units).some(U => y > U.st.start + (U.st.end - U.st.start) * 0.66 && y < U.st.end));
  };
  addEventListener("scroll", waPlace, { passive: true });
  waPlace();
})();
</script>
</body>
</html>
